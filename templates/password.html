<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password | Denise &amp; Jimmy</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="admin-page">
  <header class="admin-topbar">
    <a class="brand" href="/"><img class="brand-logo" src="/static/logo.png" alt=""><span class="brand-name">Denise Toye &amp; Jimmy Jennings<small>the wedding album</small></span></a>
    <div class="admin-top-actions">
      <a href="/admin">Back to dashboard</a>
      <form action="/admin/logout" method="post"><button class="quiet-button">Sign out</button></form>
    </div>
  </header>
  <main class="admin-shell password-shell">
    <div class="admin-title-row">
      <div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change password</h1></div>
    </div>
    <section class="admin-panel password-panel">
      <p class="panel-copy">Enter your current password, then choose a new password of at least 12 characters.</p>
      {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
      <form class="password-form" action="/admin/password" method="post">
        <label class="field"><span>Current password</span><input type="password" name="current_password" required autocomplete="current-password"></label>
        <label class="field"><span>New password</span><input type="password" name="new_password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
        <label class="field"><span>Confirm new password</span><input type="password" name="confirm_password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
        <button class="button button-primary" type="submit">Update password</button>
      </form>
    </section>
  </main>
</body>
</html>
